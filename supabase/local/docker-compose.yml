# Stack LOCAL de desenvolvimento e teste: Postgres + Supabase Auth (GoTrue) + PostgREST, os mesmos
# componentes do Supabase hospedado. NÃO é produção: o segredo abaixo é público de propósito.
name: prontus-auth
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: local-dev-postgres, POSTGRES_DB: prontus }
    ports: ["127.0.0.1:54322:5432"]   # só esta máquina: as senhas desta stack são públicas
    volumes:
      - ./00-papeis.sql:/docker-entrypoint-initdb.d/00-papeis.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d prontus"], interval: 2s, retries: 30 }
  auth:
    image: supabase/gotrue:v2.158.1
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:local-dev-auth@db:5432/prontus
      GOTRUE_SITE_URL: http://localhost:3005
      GOTRUE_JWT_SECRET: local-dev-jwt-secret-com-pelo-menos-32-caracteres
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "true"          # sem cadastro aberto: contas só pelo administrador
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "100"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: "10"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:local-dev-authenticator@db:5432/prontus
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-dev-jwt-secret-com-pelo-menos-32-caracteres
  gateway:
    image: nginx:alpine
    depends_on: [auth, rest]
    ports: ["127.0.0.1:54321:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
