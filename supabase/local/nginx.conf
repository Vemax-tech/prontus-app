# Faz o papel do gateway do Supabase: um só endereço (http://localhost:54321) para /auth/v1 e /rest/v1.
server {
  listen 80;
  add_header Access-Control-Allow-Origin $http_origin always;
  add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, prefer, accept-profile" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  if ($request_method = OPTIONS) { return 204; }
  # GoTrue e PostgREST já mandam CORS (`*`); sem isto o navegador recebe o cabeçalho duplicado e recusa.
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  location /auth/v1/ { proxy_pass http://auth:9999/; proxy_set_header Host $host; }
  location /rest/v1/ { proxy_pass http://rest:3000/; proxy_set_header Host $host; }
}
